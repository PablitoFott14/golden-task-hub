name: Deploy to GitHub Pages

# Builds the Green Shell project and publishes it as the site.
#
# The repo carries two independent projects, `Green Shell/` and `Red Shell/`,
# each a complete app with its own package.json, config and public assets.
# GitHub Pages serves one site per repo, and that site is Green Shell. Red Shell
# is preserved, buildable and recoverable from git, but is no longer published.
# To publish Red Shell again, swap the two paths below. Nothing else differs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Green Shell"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Where the Increase Complexity Proposals function is deployed. Unset
          # is a supported state: the tool's button stays disabled and the page
          # says so, so a missing secret never breaks a deploy.
          VITE_COMPLEXITY_API: ${{ secrets.COMPLEXITY_API_URL }}
          # Optional, and only a speed bump. A build time value is compiled into
          # the bundle and is readable by anyone, so this is config rather than a
          # secret: it exists so the function's ACCESS_CODE can be switched on.
          # The spend cap on the API account is the real backstop.
          VITE_COMPLEXITY_CODE: ${{ secrets.COMPLEXITY_ACCESS_CODE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Green Shell/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
