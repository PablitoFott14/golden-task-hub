name: Deploy to GitHub Pages

# Builds the Green Shell project and publishes it as the site.
#
# The repo carries two independent projects, `Green Shell/` and `Red Shell/`,
# each a complete app with its own package.json, config and public assets.
# GitHub Pages serves one site per repo, and that site is Green Shell. Red Shell
# is preserved, buildable and recoverable from git, but is no longer published.
# To publish Red Shell again, swap the two paths below. Nothing else differs.
#
# The build also packs each persona universe as a ZIP (Green Shell's
# vite.config.ts). Those are not part of the site: the release job attaches
# them to the GitHub release `universes`, which the Universes tab's download
# buttons link to, uploading a ZIP only when its contents changed
# (Green Shell/scripts/universes_release.mjs). It runs before the deploy, so
# the site never links to a ZIP older than itself. It is also the only job that
# can write to the repo; the build, which runs npm packages, stays read only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Green Shell"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Where the Increase Complexity Proposals function is deployed. Unset
          # is a supported state: the tool's button stays disabled and the page
          # says so, so a missing secret never breaks a deploy.
          VITE_COMPLEXITY_API: ${{ secrets.COMPLEXITY_API_URL }}
          # Optional, and only a speed bump. A build time value is compiled into
          # the bundle and is readable by anyone, so this is config rather than a
          # secret: it exists so the function's ACCESS_CODE can be switched on.
          # The spend cap on the API account is the real backstop.
          VITE_COMPLEXITY_CODE: ${{ secrets.COMPLEXITY_ACCESS_CODE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Green Shell/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: universe-zips
          path: "Green Shell/universe-zips"
          retention-days: 1
          # They are ZIPs already.
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: "Green Shell/scripts"
      - uses: actions/download-artifact@v4
        with:
          name: universe-zips
          path: universe-zips
      - run: node "Green Shell/scripts/universes_release.mjs" universe-zips
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploy:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
