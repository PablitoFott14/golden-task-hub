<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .card { fill: #111a33; stroke: #26335c; stroke-width: 2; }
      .title { fill: #ffffff; font: 700 34px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .subtitle { fill: #c9d3ff; font: 500 18px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .kpi { fill: #ffffff; font: 800 44px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .kpiLabel { fill: #c9d3ff; font: 600 16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; letter-spacing: 0.4px; }
      .groupTitle { fill: #ffffff; font: 800 20px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .vendor { fill: #e9edff; font: 600 18px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .note { fill: #a9b7ff; font: 500 14px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .pillConfirmed { fill: #0f3d2e; stroke: #1bd49a; stroke-width: 2; }
      .pillUnconfirmed { fill: #3b2f0f; stroke: #ffcc66; stroke-width: 2; }
      .pillNotCancelled { fill: #3b1420; stroke: #ff6b8a; stroke-width: 2; }
      .pillText { fill: #ffffff; font: 800 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; letter-spacing: 0.6px; }
      .divider { stroke: #26335c; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="780" />

  <!-- Header -->
  <text class="title" x="60" y="70">Vendor closeout — where we stand</text>
  <text class="subtitle" x="60" y="105">Based on cancellation evidence currently on hand (Feb 2026 shutdown work)</text>

  <!-- KPI Cards -->
  <rect class="card" x="60" y="140" width="520" height="140" rx="16" />
  <text class="kpiLabel" x="90" y="180">TOTAL OUTSTANDING (CONFIRMED RECEIPTS)</text>
  <text class="kpi" x="90" y="235">$2,650.00</text>
  <text class="note" x="90" y="265">Datadog ($310.00) + Singular ($2,340.00) + Soundly ($0.00)</text>

  <rect class="card" x="620" y="140" width="520" height="140" rx="16" />
  <text class="kpiLabel" x="650" y="180">% OF SHUTDOWN COST ESTIMATE</text>
  <text class="kpi" x="650" y="235">(needs estimate)</text>
  <text class="note" x="650" y="265">Please insert shutdown estimate value to compute % (e.g., $2,650 / estimate).</text>

  <!-- Groups -->
  <line class="divider" x1="60" y1="310" x2="1140" y2="310" />

  <!-- Confirmed column -->
  <rect class="card" x="60" y="340" width="350" height="360" rx="16" />
  <rect class="pillConfirmed" x="90" y="365" width="190" height="30" rx="15" />
  <text class="pillText" x="105" y="386">CONFIRMED</text>
  <text class="note" x="90" y="415">Receipts generated</text>

  <text class="vendor" x="90" y="460">• Datadog, Inc.</text>
  <text class="vendor" x="90" y="500">• Singular</text>
  <text class="vendor" x="90" y="540">• Soundly</text>

  <!-- Unconfirmed column -->
  <rect class="card" x="425" y="340" width="350" height="360" rx="16" />
  <rect class="pillUnconfirmed" x="455" y="365" width="220" height="30" rx="15" />
  <text class="pillText" x="470" y="386">UNCONFIRMED</text>
  <text class="note" x="455" y="415">Missing Slack + attachment pair</text>

  <text class="vendor" x="455" y="460">• Helpshift</text>

  <!-- Not cancelled column -->
  <rect class="card" x="790" y="340" width="350" height="360" rx="16" />
  <rect class="pillNotCancelled" x="820" y="365" width="230" height="30" rx="15" />
  <text class="pillText" x="835" y="386">NOT CANCELLED</text>
  <text class="note" x="820" y="415">Kept / active / transferred</text>

  <text class="vendor" x="820" y="460">• Carta</text>

  <!-- Footer -->
  <text class="note" x="60" y="745">Generated for board closeout tracking. Source files: receipts in VENDORS CANCELLED + MEMORY.md categorization.</text>
</svg>
